[package]
name = "locald-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
directories = "6.0.0"
flate2 = "1.1.5"
futures = "0.3.31"
git2 = { version = "0.20", default-features = false }
libc = "0.2.178"
locald-hosts = { version = "0.1.0", path = "../locald-hosts" }
locald-publisher-protocol = { version = "0.1.0", path = "../locald-publisher-protocol" }
oci-distribution = "0.11.0"
portable-pty = "0.9.0"
schemars = "1.1.0"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tar = "0.4.44"
thiserror = "2.0.17"
tokio = { version = "1", features = ["io-util", "process", "fs", "sync", "rt"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
toml = "0.9.8"
uuid = { version = "1.19.0", features = ["serde", "v4", "v5"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.23.0"
