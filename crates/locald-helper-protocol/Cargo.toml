[package]
name = "locald-helper-protocol"
version = "0.1.0"
edition.workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
security-framework = "2.11"
security-framework-sys = "2.15"

[dev-dependencies]
nix = { version = "0.30", features = ["fs"] }
tempfile = "3"

[lints]
workspace = true
