[package]
name = "locald-agent"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "locald-agent"
path = "src/main.rs"

[dependencies]
locald-core = { path = "../locald-core" }
locald-utils = { path = "../locald-utils" }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.21"
muda = "0.17"
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSEvent",
  "NSRunningApplication",
] }
objc2 = { version = "0.6" }
objc2-foundation = { version = "0.3", features = ["NSDate", "NSRunLoop", "NSTimer", "block2"] }
block2 = "0.6"
xpc-connection = { git = "https://github.com/dfrankland/xpc-connection-rs.git", branch = "master" }
futures = "0.3"
tokio = { version = "1", features = ["rt", "time"] }
