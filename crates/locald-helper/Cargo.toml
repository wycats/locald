[package]
name = "locald-helper"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "locald-helper"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
xpc-connection = { git = "https://github.com/dfrankland/xpc-connection-rs.git", branch = "master", features = [
  "audit_token",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
anyhow = "1"
nix = { version = "0.30", features = ["user", "fs"] }
socket2 = "0.5"
tracing = "0.1"

[lints]
workspace = true
