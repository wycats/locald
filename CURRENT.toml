# RFC 0130: Host Shim Daemon - Implementation Plan
#
# Goal: Get Toolbx workflow working where:
# - locald shim runs on host (handles DNS, certs, cgroups)
# - locald server runs in container (manages dev services)
# - Browser/VS Code on host access services via *.localhost

[plan]
title = "RFC 0130: Host Shim Daemon for Container Development"
rfc = "docs/rfcs/stage-2/0130-host-shim-daemon.md"
status = "in-progress"

[plan.context]
description = """
The daemon infrastructure is ~85% complete. Socket handling, protocol, lifecycle
management, and security are all implemented. Three critical gaps block the
Toolbx workflow.
"""

current_issue = """
When running `locald admin setup` on host:
- Polkit policy fails to install with permission error
- The command runs as normal user but tries to write to /usr/share/polkit-1/actions/
- Need pkexec/sudo to write system polkit policy, OR install to user location
"""

# ==============================================================================
# PHASE A: MVP (10-12 hours) - Get Toolbx Working
# ==============================================================================

[[tasks]]
id = "A1"
name = "Fix Polkit Policy Installation"
priority = "critical"
complexity = "small"
hours = "2-3"
status = "not-started"

description = """
The polkit policy installation is failing because:
1. `locald admin setup` runs the shim installation via pkexec (privileged)
2. But polkit policy write happens AFTER returning from privileged context
3. So it tries to write to /usr/share/polkit-1/actions/ as normal user

Root cause: The polkit installation code runs outside the privileged block.
"""

files = ["crates/locald-cli/src/admin.rs", "assets/dev.locald.policy"]

implementation = """
Option A (Recommended): Move polkit installation INTO the shim binary
- Add `--install-policy` flag to `locald-shim install`
- Shim already runs as root, can write to system dirs
- Single privileged execution handles everything

Option B: Use separate pkexec call for polkit
- Run `pkexec install -m 644 policy.txt /usr/share/polkit-1/actions/dev.locald.policy`
- Requires second auth dialog (poor UX)

Option C: Embed policy installation in shim install routine
- The shim's install() function already runs privileged
- Just add the policy file copy there
"""

test = """
1. Run `locald admin setup` on fresh system
2. Verify /usr/share/polkit-1/actions/dev.locald.policy exists
3. Verify `pkexec locald shim serve` shows GUI auth dialog
"""

[[tasks]]
id = "A2"
name = "Wire Up Privileged Operation Handlers"
priority = "critical"
complexity = "medium"
hours = "3-4"
status = "not-started"

description = """
The shim daemon handlers are placeholders that ACK requests but don't execute:
```rust
ShimRequest::HostsSync { entries } => {
    let _ = entries; // TODO: Actually sync hosts file
    eprintln!("HostsSync: would sync {} entries", entries.len());
    ShimResponse::ok_empty()
}
```

Need to wire these to actual implementations.
"""

files = ["crates/locald-shim/src/daemon.rs"]

implementation = """
Replace stub handlers with calls to existing functions:

1. HostsSync -> Call hosts file update logic (locald-core hosts module)
2. CgroupSetup -> Call do_cgroup_setup() from shim
3. CgroupKill -> Call do_kill() from shim  
4. CaTrust -> Call cert trust logic
5. BindPort -> Implement SCM_RIGHTS FD passing

The operations already exist - just need to call them from handlers.
"""

test = """
1. Start daemon on host: `locald shim serve --foreground`
2. In container, run: `locald up` on a test project
3. Verify hosts file updated with service domains
4. Verify cgroups created for services
"""

[[tasks]]
id = "A3"
name = "Implement Auto-Start from Container"
priority = "critical"
complexity = "large"
hours = "5-6"
status = "not-started"

description = """
When locald runs in a container and socket connection fails:
- Currently: Returns error with remediation message
- Should: Auto-start daemon on host via flatpak-spawn/distrobox-host-exec
"""

files = [
  "crates/locald-utils/src/privileged.rs",
  "crates/locald-utils/src/container.rs",  # New file
]

implementation = """
1. Create container.rs with start_host_shim():
   - Check for user-configured host_exec template
   - Auto-detect: try flatpak-spawn, then distrobox-host-exec
   - Execute: `flatpak-spawn --host pkexec locald shim serve`

2. Modify privileged.rs acquire():
   - After socket failure, if in container:
   - Call start_host_shim()
   - Wait up to 5 seconds for socket to appear
   - Retry connection
   - If still fails, return actionable error

3. Config integration:
   - Load GlobalConfig to get [container].host_exec template
   - Pass through call chain or use separate function
"""

test = """
1. Kill any running shim daemon on host
2. In container: `locald up`
3. Verify GUI password dialog appears on host
4. Verify daemon starts and socket created
5. Verify locald proceeds successfully
"""

# ==============================================================================
# PHASE B: Polish (7-9 hours) - Production Robustness
# ==============================================================================

[[tasks]]
id = "B1"
name = "Enhance locald doctor for Container Mode"
priority = "high"
complexity = "medium"
hours = "2-3"
status = "not-started"

description = """
`locald doctor` should check socket connectivity when in container.
Currently it only checks setuid shim status.
"""

files = ["crates/locald-utils/src/privileged.rs"]

implementation = """
Add container-specific checks:
1. Detect container environment
2. Check socket exists at ~/.locald/shim.sock
3. Test connection with Ping request
4. Report status with clear remediation if failed
"""

[[tasks]]
id = "B2"
name = "Socket Path Override Support"
priority = "medium"
complexity = "small"
hours = "2"
status = "not-started"

description = """
Support custom socket paths via config for NFS homes or custom setups.
"""

files = [
  "crates/locald-shim/src/daemon.rs",
  "crates/locald-utils/src/shim_client.rs",
]

implementation = """
1. Add shim_socket to DaemonConfig
2. Modify socket_path() to check config first
3. Add --socket CLI arg to `locald shim serve`
4. Pass through ShimClient connection
"""

[[tasks]]
id = "B3"
name = "Systemd User Service Helper"
priority = "low"
complexity = "small"
hours = "1-2"
status = "not-started"

description = """
Provide `locald shim install-service` to generate systemd user unit.
"""

files = ["crates/locald-shim/src/main.rs"]

[[tasks]]
id = "B4"
name = "NFS Home Directory Fallback"
priority = "low"
complexity = "small"
hours = "2"
status = "not-started"

description = """
Detect NFS mount and use /run/user/$UID/locald/shim.sock instead.
"""

files = [
  "crates/locald-shim/src/daemon.rs",
  "crates/locald-utils/src/shim_client.rs",
]

# ==============================================================================
# Implementation Order
# ==============================================================================

[plan.order]
description = """
Recommended implementation sequence:

1. A1 (Fix Polkit) - Unblocks testing of everything else
2. A2 (Wire Handlers) - Makes daemon actually work  
3. A3 (Auto-Start) - Completes the UX
4. [Test end-to-end in real Toolbx workflow]
5. B1-B4 as needed

A1 should be done first because it fixes an existing bug that blocks
the user from properly setting up their system.
"""

mvp = ["A1", "A2", "A3"]
polish = ["B1", "B2", "B3", "B4"]

