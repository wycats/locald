[plan.notes]
key_insight = """
The daemon infrastructure is 85% complete. What remains is mostly WIRING:
- Handlers exist but are stubs
- Config exists but isn't loaded
- Detection exists but doesn't trigger auto-start

This is 3 discrete tasks that can be implemented and tested independently.
"""

polkit_issue = """
CURRENT BUG: `locald admin setup` shows:
  "Polkit policy not installed: Failed to write polkit policy to /usr/share/polkit-1/actions/dev.locald.policy"

Root cause: Policy write happens after pkexec returns, running as normal user.
Fix: Move policy installation into the privileged shim install routine.
"""
