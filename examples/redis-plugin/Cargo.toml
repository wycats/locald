[package]
name = "redis-plugin"
version = "0.1.0"
edition = "2021"
description = "Example locald plugin providing Redis service"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.36", features = ["macros"] }

[package.metadata.component]
package = "locald:redis-plugin"

[package.metadata.component.target]
path = "../../crates/locald-server/wit"
world = "locald-plugin"

[profile.release]
opt-level = "s"
lto = true
